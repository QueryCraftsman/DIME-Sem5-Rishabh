[project]
name = "dime-backend"
version = "0.1.0"
description = "DIME — AI Product Intelligence & Idea Validation Platform (Backend)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # ── Web framework ─────────────────────────────────
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",

    # ── Validation / Settings ─────────────────────────
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",

    # ── Database ──────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "alembic>=1.14.0,<2.0",
    "asyncpg>=0.30.0,<1.0",
    "psycopg2-binary>=2.9.10,<3.0",

    # ── Cache / Message broker ────────────────────────
    "redis>=5.2.0,<6.0",

    # ── Background jobs ───────────────────────────────
    "celery[redis]>=5.4.0,<6.0",

    # ── HTTP client ───────────────────────────────────
    "httpx>=0.28.0,<1.0",

    # ── AI orchestration ──────────────────────────────
    "langgraph>=0.2.60,<1.0",
    "langchain>=0.3.12,<1.0",
    "langchain-core>=0.3.25,<1.0",
    "langchain-openai>=0.2.14,<1.0",
    "langchain-anthropic>=0.3.3,<1.0",
    "langchain-google-genai>=2.0.8,<3.0",
    "langchain-community>=0.3.12,<1.0",

    # ── Embeddings / Reranking ────────────────────────
    "sentence-transformers>=3.3.0,<4.0",

    # ── Vector database ───────────────────────────────
    "qdrant-client>=1.12.0,<2.0",

    # ── Web crawling ──────────────────────────────────
    "crawl4ai>=0.4.0,<1.0",

    # ── Object storage ────────────────────────────────
    "boto3>=1.35.0,<2.0",

    # ── Observability ─────────────────────────────────
    "sentry-sdk[fastapi]>=2.19.0,<3.0",
    "opentelemetry-api>=1.29.0,<2.0",
    "opentelemetry-sdk>=1.29.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "prometheus-client>=0.21.0,<1.0",
    "structlog>=24.4.0,<25.0",

    # ── Security ──────────────────────────────────────
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",

    # ── Utilities ─────────────────────────────────────
    "python-dotenv>=1.0.1,<2.0",
    "tenacity>=9.0.0,<10.0",
    "python-dateutil>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "httpx",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
