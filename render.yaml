services:
  - type: web
    name: dime-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash backend/start.sh
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false

